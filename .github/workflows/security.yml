---
# Supply-chain security scanners that report to GitHub Code Scanning.
# Two jobs run the project's dependency scanners with SARIF output and
# upload each result under its own category: govulncheck over the call
# graph, and gomodscan over the vendored module set (retraction,
# deprecation, and OSV malicious-package checks).
#
# Triggers cover pull requests and pushes to `main` — the pushes seed
# the Code Scanning baseline that pull-request diffs compare against —
# plus a daily cron that catches advisories published against
# already-merged dependencies long after the pull request that added
# them. Findings surface in the Security tab through SARIF rather than
# failing the run, so a warning-level deprecation does not gate a pull
# request. The blocking govulncheck gate stays in `ci.yml`.
#
# Each job installs the pinned go through a SHA-pinned jdx/mise-action
# and invokes the matching `*-sarif` mise task, so the scan command stays
# the single source of truth shared with local runs.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "26 6 * * *"

permissions:
  contents: read

# Refuse a pin the committed lockfiles have not seen; see ci.yml.
env:
  MISE_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.16
          install_args: go

      - name: Run govulncheck (SARIF)
        run: mise run vuln-sarif govulncheck.sarif

      - name: Upload govulncheck SARIF
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  gomodscan:
    name: gomodscan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.16
          install_args: go

      - name: Run gomodscan (SARIF)
        run: mise run gomodscan-sarif gomodscan.sarif

      - name: Upload gomodscan SARIF
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: gomodscan.sarif
          category: gomodscan
